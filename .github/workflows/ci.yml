name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reel-bot .
      - name: Smoke test the image
        run: |
          docker run --rm -e TELEGRAM_BOT_TOKEN=1:x -e GEMINI_API_KEY=x -e DATA_DIR=/tmp/data \
            --entrypoint python reel-bot -c "import bot; bot.build_app(); print('ok')"
          docker run --rm --entrypoint sh reel-bot -c 'test ! -e .env && test ! -e cookies.txt && ffmpeg -version >/dev/null'
